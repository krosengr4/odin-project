<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tic Tac Toe</title>
        <link href="style.css" rel="stylesheet" type="text/css" />
    </head>
    <body>
        <div class="container">
            <form class="playerForm">
                <label for="playerOneName">Player 1's Name:</label>
                <input
                    type="text"
                    id="playerOneName"
                    name="playerOneName"
                /><br />
                <label for="playerTwoName">Player 2's Name:</label>
                <input
                    type="text"
                    id="playerTwoName"
                    name="playerTwoName"
                /><br />
                <input type="submit" id="submitButton" value="Play" />
            </form>
            <h1 class="turn"></h1>
            <div class="board"></div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
