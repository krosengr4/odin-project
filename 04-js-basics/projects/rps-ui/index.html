<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="title">
            <h1>Rock Paper Scissors!</h1>
            <h3>Think you're good enough to win? Prove it.</h3>
        </div>
        <div class="game">
            <button class="play">PLAY</button>
            <button class="rock choice">ROCK</button>
            <button class="paper choice">PAPER</button>
            <button class="scissors choice">SCISSORS</button>
        </div>
        <div class="results"></div>
        <hr />
        <div class="overall-results">
            <p class="overall-user-wins">User Wins: 0</p>
            <p class="overall-comp-wins">Comp Wins: 0</p>
            <p class="overall-ties">Ties: 0</p>
        </div>
    </body>
    <script src="script.js"></script>
</html>
